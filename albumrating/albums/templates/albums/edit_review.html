{% extends 'base.html' %}

{% block content %}
  {% with review=template_data.review %}
    <section class="auth-card">
      <h1>Edit review</h1>

      <form method="POST" action="{% url 'albums.edit_review' id=review.album.id review_id=review.id %}">
        {% csrf_token %}
        {% include 'albums/star_picker.html' with current=review.rating %}
        <div class="form-field">
          <label for="comment">Your review of {{ review.album.name }}</label>
          <textarea id="comment" name="comment" rows="12" maxlength="5000" required aria-describedby="comment-limit">{{ review.comment }}</textarea>
          <div class="field-help" id="comment-limit">Up to 5,000 characters.</div>
        </div>
        <button type="submit">Save review</button>
      </form>

      <p class="review-prompt"><a href="{% url 'albums.show' id=review.album.id %}">Cancel</a></p>
    </section>
  {% endwith %}
{% endblock %}
